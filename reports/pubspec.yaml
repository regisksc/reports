name: reports
description: Illegal dumping reports for Los Angeles.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.2.4
  geolocator: ^14.1.2
  http: ^1.6.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.3
  geocoding: ^5.0.0
  share_plus: ^13.3.1
  timezone: ^0.11.2
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  path_provider_platform_interface: ^2.1.3
  shared_preferences_platform_interface: ^2.4.2
  geolocator_platform_interface: ^4.4.1
  image_picker_platform_interface: ^2.11.2
  url_launcher_platform_interface: ^2.3.2
  geocoding_platform_interface: ^5.0.0

flutter:
  assets:
    - assets/brand/reports-pop-horizontal-color.png
    - assets/service_catalog.json
    - assets/illegal_dumping_items.json

  fonts:
    - family: Mona Sans
      fonts:
        - asset: assets/fonts/MonaSans.ttf

  uses-material-design: true
